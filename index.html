<!DOCTYPE html>
<html lang="es">
<head>

<title>Laboratorio 1 · Interruptor crepuscular 3D</title>
<style>
  :root{--ink:#14171f;--muted:#667085;--line:#e6e8ee;--card:rgba(255,255,255,.94);--accent:#2563eb}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(20,23,31,.08);backdrop-filter:blur(6px)}
  #brand{position:fixed;left:16px;top:16px;width:225px;padding:0;overflow:hidden}
  #brandHead{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;cursor:pointer}
  #brandHead:hover{background:#f7f9fc}
  #brandHead .kicker{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  #brandHead .title{display:block;margin-top:3px;font-size:15px;font-weight:700;line-height:1.2}
  #brandHead .chev{flex:none;font-size:11px;color:var(--muted);transition:transform .18s}
  #brand.open #brandHead .chev{transform:rotate(180deg)}
  #parts{border-top:1px solid var(--line);padding:8px;max-height:min(50vh,400px);overflow:auto}
  #parts h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 6px 6px}
  #partList{list-style:none;margin:0;padding:0}
  #partList button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13px}
  #partList button:hover{background:#f2f5fb}
  #partList button.sel{background:#e8efff;color:#1d4ed8;font-weight:600}
  .num{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  #info{position:fixed;right:16px;top:16px;width:340px;padding:16px 18px;max-height:calc(100vh - 32px - 215px);overflow:auto}
  #info .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
  #info .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#eef2ff;color:#3730a3}
  #info h2{margin:8px 0 4px;font-size:19px;line-height:1.25}
  #info .spec{font-size:12px;color:var(--muted);margin-bottom:10px}
  #info h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
  #info p{margin:0}
  #info .tip{margin-top:12px;padding:9px 11px;border-radius:10px;background:#fff7e6;border:1px solid #fde3a7;font-size:13px}
  #info .nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
  button.b{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  button.b:hover{border-color:#c7cfdd;background:#f7f9fc}
  button.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.b.off{background:#fee2e2;border-color:#fecaca;color:#991b1b}
  #bottom{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1120px,calc(100% - 28px));display:flex;gap:12px;align-items:flex-end}
  .cardHead{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 14px;cursor:pointer}
  .cardHead:hover{background:#f7f9fc}
  .cardHead .title{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .cardHead .chev{font-size:10px;color:var(--muted);transition:transform .18s}
  .card.open .cardHead .chev{transform:rotate(180deg)}
  #dock{flex:1 1 auto;padding:0;overflow:hidden}
  #dockBody{border-top:1px solid var(--line);padding:9px 14px 11px;display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
  #meter{flex:0 0 335px;padding:0;overflow:hidden}
  #meterBody{border-top:1px solid var(--line);padding:8px 10px 10px}
  .ctrl label{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px}
  .ctrl b{font-variant-numeric:tabular-nums;color:var(--accent)}
  .ctrl input{width:100%;margin:5px 0 1px;accent-color:var(--accent)}
  .scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
  .readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .readouts div{background:#f6f8fb;border-radius:8px;padding:4px 7px}
  .readouts small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .readouts b{font-variant-numeric:tabular-nums;font-size:13px}
  .state{margin-top:6px;padding:5px 8px;border-radius:8px;text-align:center;font-weight:700;font-size:12px;background:#eaf2ff;color:#1e40af}
  .state.night{background:#dcfce7;color:#166534}
  .btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px;padding-top:6px}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .label{position:absolute;left:0;top:0;white-space:nowrap;font-size:11.5px;font-weight:600;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer}
  .label .num{width:18px;height:18px;font-size:10px}
  #tooltip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(12px,12px)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;font-weight:600;color:var(--muted)}
  #togParts{display:none}
  @media (max-width:820px){
    #brand{width:auto;right:16px}
    .scale{display:none}
    #togParts{display:inline-block}
    #parts{max-height:40vh}
    #info{left:16px;right:16px;width:auto;top:80px;max-height:45vh}
    #bottom{flex-direction:column;align-items:stretch;bottom:8px;gap:8px}
    #meter{flex:1 1 auto}
    #dockBody{grid-template-columns:1fr;gap:4px}
    .btns{padding-top:6px;gap:6px}
    button.b{padding:5px 8px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<aside id="brand" class="card">
  <button id="brandHead" aria-expanded="false">
    <span>
      <span class="kicker">Laboratorio 1 · 3D</span>
      <span class="title">INTERRUPTOR CREPUSCULAR</span>
    </span>
    <span class="chev">▼</span>
  </button>
  <div id="parts" hidden>
    <h2>Materiales</h2>
    <ol id="partList"></ol>
  </div>
</aside>

<aside id="info" class="card" hidden>
  <button class="x" id="infoClose" aria-label="Cerrar">×</button>
  <span class="tag" id="infoTag"></span>
  <h2 id="infoName"></h2>
  <p id="infoDesc"></p>
  <div class="tip" id="infoTip"></div>
  <div class="nav"><button class="b" id="prev">← Anterior</button><button class="b" id="next">Siguiente →</button></div>
</aside>

<div id="bottom">
  <div id="dock" class="card open">
    <button class="cardHead" id="dockHead" aria-expanded="true"><span class="title">Controles</span><span class="chev">▼</span></button>
    <div id="dockBody">
      <div class="ctrl">
        <label for="light"><span>☀️ Luz sobre la LDR</span><b id="luxOut"></b></label>
        <input type="range" id="light" min="0" max="100" step="0.1" value="80">
        <div class="scale"><span>Noche</span><span>Día</span></div>
      </div>
      <div class="ctrl">
        <label for="rv"><span>🎚️ RV1 (sensibilidad)</span><b id="rvOut"></b></label>
        <input type="range" id="rv" min="0" max="100" step="0.1" value="50">
        <div class="scale"><span>Enciende con penumbra</span><span>Solo noche cerrada</span></div>
      </div>
      <div class="btns">
        <button class="b" id="togParts">Piezas</button>
        <button class="b" id="btnCycle">▶ Ciclo día/noche</button>
        <button class="b" id="btnExplode">Vista explosionada</button>
        <button class="b" id="btnLabels">Etiquetas</button>
        <button class="b" id="btnReset">Reiniciar vista</button>
      </div>
    </div>
  </div>

  <div id="meter" class="card">
    <button class="cardHead" id="meterHead" aria-expanded="false"><span class="title">Medidas</span><span class="chev">▼</span></button>
    <div id="meterBody" hidden>
      <div class="readouts">
        <div><small>V AC sec.</small><b id="vacOut"></b></div>
        <div><small>V DC (C1)</small><b id="vdcOut"></b></div>
        <div><small>V zener</small><b id="vzOut"></b></div>
        <div><small>R LDR</small><b id="rOut"></b></div>
        <div><small>V base Q2</small><b id="vbOut"></b></div>
        <div><small>I colector</small><b id="icOut"></b></div>
      </div>
      <div class="state" id="stateOut"></div>
    </div>
  </div>
</div>

<div id="tooltip" hidden></div>


<div id="loading">Cargando escena 3D…</div>

<script>
  setTimeout(function(){var l=document.getElementById('loading');if(l&&!l.hidden)l.textContent='No se pudo cargar Three.js. Revisa tu conexión a internet y recarga.';},12000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- Renderer / escena ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffffff');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 400);
const HOME = { pos: new THREE.Vector3(-8.0, 24.5, 25), target: new THREE.Vector3(-7.6, -1.8, 2.8) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.05;          // más deslizamiento, movimiento menos brusco
controls.minDistance = 1.2;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.49;
controls.zoomToCursor = true;          // el zoom va hacia donde apunta el cursor
controls.screenSpacePanning = true;
controls.zoomSpeed = 0.6;
controls.rotateSpeed = 0.45;
controls.panSpeed = 0.8;
// que la vista no se pierda fuera de la mesa
const LIM = { x: [-22, 10], y: [-1.5, 6], z: [-8, 10] };
function clampTarget() {
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, LIM.x[0], LIM.x[1]);
  t.y = THREE.MathUtils.clamp(t.y, LIM.y[0], LIM.y[1]);
  t.z = THREE.MathUtils.clamp(t.z, LIM.z[0], LIM.z[1]);
}

const hemi = new THREE.HemisphereLight('#ffffff', '#e9dcc8', 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e6', 2.4);
sun.position.set(4, 24, 13);
sun.target.position.set(-5, 0, 0);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);   // sombras finas: ya solo se calculan cuando algo se mueve
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 20, bottom: -20, near: 1, far: 90 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
sun.shadow.autoUpdate = false;    // la sombra solo se recalcula cuando algo se mueve de verdad
sun.shadow.needsUpdate = true;
scene.add(sun);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.5);
fill.position.set(-16, 9, -8);
scene.add(fill);

/* ---------- Helpers ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const std = (color, roughness = 0.5, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const TIN_SRC = std('#d5d8dd', 0.3, 1);
const TIN = () => TIN_SRC;            // material compartido: permite unir las mallas
function mesh(geo, mat, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}
function vCyl(r, y0, y1, x, z, mat, seg = 12) {
  const m = mesh(new THREE.CylinderGeometry(r, r, y1 - y0, seg), mat);
  m.position.set(x, (y0 + y1) / 2, z);
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function decal(tex, w, h) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.userData.noHighlight = true;
  return m;
}
function textTex(w, h, lines, color = '#fff', bg = null) {
  return canvasTex(w, h, (x) => {
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, h); }
    x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
    lines.forEach(([txt, font, y]) => { x.font = font; x.fillText(txt, w / 2, y); });
  });
}
function roundedPath(raw, rad) {
  const pts = raw.filter((p, i) => i === 0 || p.distanceTo(raw[i - 1]) > 1e-4);
  const path = new THREE.CurvePath();
  let cur = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const dIn = p.clone().sub(pts[i - 1]); const lIn = dIn.length(); dIn.normalize();
    const dOut = pts[i + 1].clone().sub(p); const lOut = dOut.length(); dOut.normalize();
    const r = Math.min(rad, lIn * 0.45, lOut * 0.45);
    const a = p.clone().addScaledVector(dIn, -r), b = p.clone().addScaledVector(dOut, r);
    if (cur.distanceTo(a) > 1e-4) path.add(new THREE.LineCurve3(cur.clone(), a));
    path.add(new THREE.QuadraticBezierCurve3(a, p.clone(), b));
    cur = b;
  }
  const end = pts[pts.length - 1];
  if (cur.distanceTo(end) > 1e-4) path.add(new THREE.LineCurve3(cur, end.clone()));
  return path;
}
function tubeAlong(pts, r, mat, rad = 0.07) {
  const path = roundedPath(pts, rad);
  return mesh(new THREE.TubeGeometry(path, Math.max(18, Math.ceil(path.getLength() * 42)), r, 10, false), mat);
}
function smoothWire(pts, r, mat) {
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  return mesh(new THREE.TubeGeometry(curve, 160, r, 10, false), mat);
}

/* ---------- Geometría de la protoboard (830 puntos) ---------- */
const P = 0.254;                 // paso 2,54 mm (1 unidad = 1 cm)
const BOARD_TOP = 0.85;
const colX = c => (c - 32) * P;
// buses: atrás − afuera (C) y + adentro (A/B); adelante igual orden: − adentro (E) y + afuera (D)
const ROWZ = { a: 1.416, b: 1.162, c: 0.908, d: 0.654, e: 0.4, f: -0.4, g: -0.654, h: -0.908, i: -1.162, j: -1.416,
  'B-': 2.0, 'B+': 2.254, 'T+': -2.0, 'T-': -2.254 };
const hole = (c, r) => V(colX(c), BOARD_TOP, ROWZ[r]);

/* ---------- Mesa ---------- */
function buildTable() {
  const wood = canvasTex(2048, 1024, (x, w, h) => {
    x.fillStyle = '#c8935b'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 420; i++) {
      const y = Math.random() * h;
      x.strokeStyle = Math.random() < 0.8 ? `rgba(95,55,22,${0.04 + Math.random() * 0.1})` : `rgba(255,225,180,${0.06 + Math.random() * 0.08})`;
      x.lineWidth = 1 + Math.random() * 3.5;
      x.beginPath();
      for (let px = 0; px <= w; px += 16) x.lineTo(px, y + Math.sin(px * 0.004 + i) * 7 + Math.sin(px * 0.017 + i * 2) * 2);
      x.stroke();
    }
  });
  const g = new THREE.Group();
  const top = mesh(new THREE.BoxGeometry(40, 0.8, 24), std('#ffffff', 0.62, 0, { map: wood, bumpMap: wood, bumpScale: 0.035 }), false);
  top.position.set(-5, -0.4, 1); g.add(top);
  // sombras de contacto: hacen que la placa y el transformador se "apoyen" de verdad
  const blur = canvasTex(256, 256, (x, w, h) => {
    const gr = x.createRadialGradient(w / 2, h / 2, w * 0.12, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.40)'); gr.addColorStop(0.55, 'rgba(0,0,0,.14)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
  });
  for (const [px, pz, sx, sz] of [[0, 0, 19, 7.5], [-15, -1.5, 10, 7]]) {
    const ao = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: blur, transparent: true, depthWrite: false }));
    ao.rotation.x = -Math.PI / 2; ao.position.set(px, 0.012, pz); ao.renderOrder = -1; g.add(ao);
  }
  const legMat = std('#8d5f36', 0.6);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = mesh(new THREE.BoxGeometry(0.9, 12, 0.9), legMat);
    leg.position.set(-5 + sx * 18.8, -6.8, 1 + sz * 10.8); g.add(leg);
  }
  const blob = canvasTex(256, 256, (x, w, h) => {
    const gr = x.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(62, 38), new THREE.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(-5, -12.8, 1); g.add(floor);
  return g;
}
scene.add(buildTable());

/* ---------- Piezas ---------- */
function buildBoard() {
  const g = new THREE.Group();
  const body = mesh(new RoundedBoxGeometry(16.5, 0.85, 5.3, 4, 0.08), std('#f6f6f1', 0.7));
  body.position.y = 0.425; g.add(body);
  const BW = 16.34, BD = 5.14, S = 230;   // textura más fina: números y agujeros nítidos de cerca
  const tex = canvasTex(Math.round(BW * S), Math.round(BD * S), (x, w, h) => {
    const toC = (px, pz) => [(px + BW / 2) * S, (pz + BD / 2) * S];
    x.fillStyle = '#f6f6f1'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#e3e3db'; x.fillRect(0, toC(0, -0.15)[1], w, 0.3 * S);
    x.fillStyle = '#cfcfc6'; x.fillRect(0, toC(0, -0.15)[1], w, 3); x.fillRect(0, toC(0, 0.15)[1] - 3, w, 3);
    const hline = (z, col) => {
      x.fillStyle = col;
      const y = (z + BD / 2) * S - 0.018 * S, xs = toC(colX(29.6), 0)[0], xe = toC(colX(30.4), 0)[0];
      x.fillRect(toC(-8.0, 0)[0], y, xs - toC(-8.0, 0)[0], 0.036 * S);
      x.fillRect(xe, y, toC(8.0, 0)[0] - xe, 0.036 * S);
    };
    hline(-1.76, '#e0413a'); hline(-2.48, '#2f66d8'); hline(1.76, '#2f66d8'); hline(2.48, '#e0413a');
    const holeAt = (px, pz) => {
      const [u, v] = toC(px, pz), s = 0.1 * S;
      x.fillStyle = '#cdcdc5'; x.fillRect(u - s / 2 - 2, v - s / 2 - 2, s + 4, s + 4);
      x.fillStyle = '#2b2b2b'; x.fillRect(u - s / 2, v - s / 2, s, s);
      x.fillStyle = '#5a5a5a'; x.fillRect(u - s / 2, v - s / 2, s, 3);
    };
    for (let c = 1; c <= 63; c++) {
      for (const r of 'abcdefghij') holeAt(colX(c), ROWZ[r]);

function buildAxial(A, B, o) { // A = ánodo, B = cátodo (franja)

  const dir = B.clone().sub(A); dir.y = 0; dir.normalize();
  const mid = V((A.x + B.x) / 2, y, (A.z + B.z) / 2);
  const q = new THREE.Quaternion().setFromUnitVectors(V(0, 1, 0), dir);
  if (o.at !== undefined) mid.lerpVectors(V(A.x, y, A.z), V(B.x, y, B.z), o.at);   // cuerpo corrido sobre las patas
  const body = mesh(new THREE.CylinderGeometry(o.r, o.r, o.len, 26), o.body); body.quaternion.copy(q); body.position.copy(mid); g.add(body);
  const band = mesh(new THREE.CylinderGeometry(o.r + 0.004, o.r + 0.004, o.len * 0.16, 26), o.band); band.quaternion.copy(q); band.position.copy(mid).addScaledVector(dir, o.len * 0.34); g.add(band);

    [13, 'j', 13, 'T+', BLU], [13, 'a', 13, 'B-', BLU],
    [28, 'B-', 31, 'B-', BLU], [32, 'j', 45, 'j', BLU], [32, 'a', 32, 'B-', BLU],
    [34, 'a', 34, 'B-', BLU], [36, 'b', 38, 'b', BLU], [38, 'd', 38, 'f', BLU],
    [43, 'a', 43, 'B-', BLU], [44, 'a', 36, 'a', BLU],
    [45, 'b', 51, 'b', BLU],
    [52, 'i', 60, 'i', BLU], [63, 'a', 62, 'B-', BLU],

  const ins = c => { if (!insCache.has(c)) insCache.set(c, std(c, 0.45)); return insCache.get(c); };
  for (const [c1, r1, c2, r2, col] of list) {
    const A = hole(c1, r1), B = hole(c2, r2), hgt = BOARD_TOP + 0.12;
    g.add(tubeAlong([V(A.x, BOARD_TOP + 0.05, A.z), V(A.x, hgt, A.z), V(B.x, hgt, B.z), V(B.x, BOARD_TOP + 0.05, B.z)], 0.034, ins(col), 0.07));

  };
  arcOver(hole(54, 'b'), hole(45, 'g'), ORG);      // bobina+ → columna 45 (+5,1 V)
  arcOver(hole(57, 'b'), hole(45, 'h'), GRN);      // NC → columna 45 (+5,1 V)
  return g;
}

function mergePart(g) {
  const byMat = new Map();
  g.updateMatrixWorld(true);
  g.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material) || o.userData.noHighlight) return;
    const b = byMat.get(o.material.uuid) || { mat: o.material, list: [] };
    b.list.push(o); byMat.set(o.material.uuid, b);
  });
  for (const { mat, list } of byMat.values()) {
    if (list.length < 2) continue;
    const geos = list.map(m => m.geometry.clone().applyMatrix4(m.matrixWorld));
    let merged = null;
    try { merged = mergeGeometries(geos, false); } catch (_) { merged = null; }
    geos.forEach(gg => gg.dispose());
    if (!merged) continue;
    const m = new THREE.Mesh(merged, mat);
    m.castShadow = true; m.receiveShadow = true;
    list.forEach(o => { o.removeFromParent(); o.geometry.dispose(); });
    g.add(m);
  }
}

  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (on ? 180 : 120));

function solve() {
  const s = +lightEl.value, v = +rvEl.value;
  E.lux = Math.pow(10, -2 + 6 * s / 100);
  E.rL = THREE.MathUtils.clamp(20000 * Math.pow(E.lux / 10, -0.7), 300, 1e6);
  E.rv = 50 + v / 100 * 1950;

  const icoil = Math.max(0, (v5 - 0.2) / 70);
  E.ic = Math.min(ib * 150, icoil);
  E.vb = vth < 0.65 ? vth : 0.65 + 0.25 * (1 - Math.exp(-(vth - 0.65) * 1.5));

  if (!relayOn && E.ic >= 0.0525 && v5 > 3.7) relayOn = true;

  if (was !== relayOn && lastUi >= 0) { relayClick(relayOn); relayKick = 1; }

}

const sunDay = new THREE.Color('#fff4e6'), sunNight = new THREE.Color('#8ea6ff'), tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const ease = k => 1 - Math.exp(-dt * k);

  vdc += (vTarget - vdc) * ease(powered ? 6 : 0.9);

    fly.k = Math.min(1, fly.k + dt / fly.dur);
    const k = fly.k;
    const e = fly.mode === 'out' ? 1 - Math.pow(1 - k, 4)
      : (k < 0.5 ? 4 * k ** 3 : 1 - Math.pow(-2 * k + 2, 3) / 2);
    // la cámara viaja en arco alrededor del objetivo, no en línea recta
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    sphA.setFromVector3(tmpOff.copy(fly.p0).sub(fly.t0));
    sphB.setFromVector3(tmpOff.copy(fly.p1).sub(fly.t1));
    let dTheta = sphB.theta - sphA.theta;
    while (dTheta > Math.PI) dTheta -= Math.PI * 2;
    while (dTheta < -Math.PI) dTheta += Math.PI * 2;
    sphC.set(
      THREE.MathUtils.lerp(sphA.radius, sphB.radius, e),
      THREE.MathUtils.lerp(sphA.phi, sphB.phi, e),
      sphA.theta + dTheta * e);
    camera.position.copy(controls.target).add(tmpOff.setFromSpherical(sphC));
    if (fly.k >= 1) fly = null;
  }

  ledLevel += (E.led - ledLevel) * ease(12);
  dayTarget = +lightEl.value / 100;
  const newDay = dayLevel < 0 ? dayTarget : dayLevel + (dayTarget - dayLevel) * ease(4);
  if (Math.abs(newDay - dayLevel) > 0.001) {
    dayLevel = newDay;
    const d = THREE.MathUtils.smoothstep(dayLevel, 0.15, 0.85);
    sun.intensity = 0.28 + 2.17 * d;      // noche 20 % más oscura
    sun.color.copy(sunNight).lerp(sunDay, d);
    sun.position.set(-7 + 17 * d, 5 + 20 * d, 8 + 8 * d);   // el sol sube y las sombras giran
    sun.shadow.needsUpdate = true;
    hemi.intensity = 0.144 + 0.486 * d;
    fill.intensity = 0.12 + 0.38 * d;
    for (const m of allMats) m.envMapIntensity = 0.24 + 0.76 * d;
    scene.background.copy(bgNight).lerp(bgDay, d);
  }
  ledMat.emissiveIntensity = ledLevel * 3.2;
  ledLight.intensity = ledLevel * 2.0;
  ledGlow.material.opacity = ledLevel * (0.55 - 0.3 * dayLevel);   // el halo se nota más de noche

  relayKick = Math.max(0, relayKick - dt * 5);
  relayBody.position.x = colX(54) + Math.sin(t * 90) * 0.008 * relayKick;

  processHover();
  refreshHighlight(t);
  controls.update();
  if (!fly) clampTarget();

  // dibuja solo cuando algo se mueve o cambia
  const moving = !!fly || cycling || selected || relayKick > 0 ||
    Math.abs(E.led - ledLevel) > 0.002 || Math.abs(dayTarget - dayLevel) > 0.002 ||
    Math.abs(vTarget - vdc) > 0.005 ||
    PARTS.some(p => Math.abs((exploded ? p.explode : 0) - p.group.position.y) > 0.002);
  if (!moving && !needsRender) return;
  needsRender = false;
  renderer.render(scene, camera);

  // resolución adaptativa: si el equipo sufre, baja; si le sobra, sube
  if (dt < 0.06 && document.visibilityState === 'visible') { frameAcc += dt; frameN++; }
  if (frameN >= 40) {
    const avg = frameAcc / frameN; frameAcc = 0; frameN = 0;
    if (avg > 0.028 && pixR > PIX_MIN) { pixR = Math.max(PIX_MIN, pixR - 0.25); renderer.setPixelRatio(pixR); }
    else if (avg < 0.0135 && pixR < PIX_MAX) { pixR = Math.min(PIX_MAX, pixR + 0.25); renderer.setPixelRatio(pixR); }
  }

  for (const p of PARTS) {
    const el = p.labelEl;
    if (!labelsOn) { el.hidden = true; continue; }
    tmpV.copy(p.anchor); tmpV.y += p.group.position.y; tmpV.project(camera);
    if (tmpV.z > 1) { el.hidden = true; continue; }
    el.hidden = false;
    el.style.transform = `translate(${(tmpV.x * 0.5 + 0.5) * innerWidth}px,${(-tmpV.y * 0.5 + 0.5) * innerHeight}px) translate(-50%,-100%)`;
  }
}
// entrada: la cámara se acomoda sola al abrir
camera.position.set(HOME.pos.x + 5, HOME.pos.y * 1.45, HOME.pos.z * 1.3);
flyTo(HOME.pos.clone(), HOME.target.clone(), 2.2, 'out');
animate();
document.getElementById('loading').hidden = true;
</script>
</body>
</html>
